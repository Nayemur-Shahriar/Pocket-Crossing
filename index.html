
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#162e38">
  <title>Pocket Crossing</title>

  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png">
  <link rel="apple-touch-icon" href="index.apple-touch-icon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #162e38;
    }

    body {
      color: white;
      touch-action: none;
      font-family: Arial, sans-serif;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    #launch-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
      background: #162e38;
    }

    #launch-screen h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 46px);
      letter-spacing: 2px;
    }

    #play-fullscreen {
      border: 0;
      border-radius: 14px;
      padding: 18px 32px;
      background: #f4c879;
      color: #162e38;
      font-weight: 800;
      font-size: clamp(16px, 3vw, 22px);
      cursor: pointer;
      box-shadow: 0 5px 0 #ba9150;
    }

    #play-fullscreen:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #ba9150;
    }

    #orientation-message {
      max-width: 480px;
      margin: 0;
      line-height: 1.5;
      color: #d9e4e8;
    }

    #status,
    #status-splash,
    #status-progress {
      position: absolute;
      left: 0;
      right: 0;
    }

    #status,
    #status-splash {
      top: 0;
      bottom: 0;
    }

    #status {
      background: #162e38;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      visibility: hidden;
      z-index: 10;
    }

    #status-splash {
      max-height: 100%;
      max-width: 100%;
      margin: auto;
    }

    #status-splash.show-image--false {
      display: none;
    }

    #status-splash.fullsize--true {
      height: 100%;
      width: 100%;
      object-fit: contain;
    }

    #status-splash.use-filter--false {
      image-rendering: pixelated;
    }

    #status-progress,
    #status-notice {
      display: none;
    }

    #status-progress {
      bottom: 10%;
      width: 50%;
      margin: 0 auto;
    }

    #status-notice {
      background: #5b3943;
      border-radius: 0.5rem;
      border: 1px solid #9b3943;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      line-height: 1.3;
      margin: 0 2rem;
      overflow: hidden;
      padding: 1rem;
      text-align: center;
      z-index: 1;
    }
  </style>
</head>

<body>
  <canvas id="canvas">
    Your browser does not support the canvas tag.
  </canvas>

  <noscript>
    Your browser does not support JavaScript.
  </noscript>

  <div id="status">
    <img
      id="status-splash"
      class="show-image--true fullsize--true use-filter--true"
      src="index.png"
      alt=""
    >
    <progress id="status-progress"></progress>
    <div id="status-notice"></div>
  </div>

  <div id="launch-screen">
    <h1>POCKET CROSSING</h1>

    <button id="play-fullscreen" type="button">
      PLAY FULLSCREEN
    </button>

    <p id="orientation-message">
      For the best experience, play in landscape mode.
    </p>
  </div>

  <script src="index.js"></script>

  <script>
    const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":45315188,"index.wasm":38047590},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const GODOT_THREADS_ENABLED = false;
    const engine = new Engine(GODOT_CONFIG);

    (function () {
      const statusOverlay = document.getElementById("status");
      const statusProgress = document.getElementById("status-progress");
      const statusNotice = document.getElementById("status-notice");
      const launchScreen = document.getElementById("launch-screen");
      const playButton = document.getElementById("play-fullscreen");
      const orientationMessage = document.getElementById("orientation-message");
      const canvas = document.getElementById("canvas");

      let initializing = true;
      let statusMode = "";
      let started = false;

      function setStatusMode(mode) {
        if (statusMode === mode || !initializing) {
          return;
        }

        if (mode === "hidden") {
          statusOverlay.remove();
          initializing = false;
          return;
        }

        statusOverlay.style.visibility = "visible";
        statusProgress.style.display =
          mode === "progress" ? "block" : "none";
        statusNotice.style.display =
          mode === "notice" ? "block" : "none";

        statusMode = mode;
      }

      function setStatusNotice(message) {
        statusNotice.replaceChildren();

        message.split("\n").forEach((line) => {
          statusNotice.appendChild(
            document.createTextNode(line)
          );
          statusNotice.appendChild(
            document.createElement("br")
          );
        });
      }

      function displayFailureNotice(error) {
        console.error(error);

        const message =
          error instanceof Error
            ? error.message
            : typeof error === "string"
              ? error
              : "An unknown error occurred.";

        setStatusNotice(message);
        setStatusMode("notice");
        initializing = false;
      }

      function updateOrientationMessage() {
        if (window.innerHeight > window.innerWidth) {
          orientationMessage.textContent =
            "Rotate your phone to landscape mode for the best experience.";
        } else {
          orientationMessage.textContent =
            "Ready to cross? Tap PLAY FULLSCREEN.";
        }
      }

      window.addEventListener(
        "resize",
        updateOrientationMessage
      );

      updateOrientationMessage();

      function startGame() {
        if (started) {
          return;
        }

        started = true;
        launchScreen.remove();

        const missing = Engine.getMissingFeatures({
          threads: GODOT_THREADS_ENABLED
        });

        if (missing.length !== 0) {
          const missingMsg =
            "Error\n" +
            "The following features required to run " +
            "Godot projects on the Web are missing:\n";

          displayFailureNotice(
            missingMsg + missing.join("\n")
          );

          return;
        }

        setStatusMode("progress");

        engine.startGame({
          onProgress: function (current, total) {
            if (current > 0 && total > 0) {
              statusProgress.value = current;
              statusProgress.max = total;
            } else {
              statusProgress.removeAttribute("value");
              statusProgress.removeAttribute("max");
            }
          }
        }).then(
          () => {
            setStatusMode("hidden");
            canvas.focus();
          },
          displayFailureNotice
        );
      }

      function tryLandscape() {
        if (
          screen.orientation &&
          typeof screen.orientation.lock === "function"
        ) {
          try {
            Promise.resolve(
              screen.orientation.lock("landscape")
            ).catch((error) => {
              console.info(
                "Landscape lock unavailable. Rotate manually.",
                error
              );
            });
          } catch (error) {
            console.info(
              "Landscape lock unavailable:",
              error
            );
          }
        }
      }

      playButton.addEventListener("click", () => {
        let fullscreenRequest;

        try {
          if (document.documentElement.requestFullscreen) {
            fullscreenRequest =
              document.documentElement.requestFullscreen();
          } else if (
            document.documentElement.webkitRequestFullscreen
          ) {
            fullscreenRequest =
              document.documentElement.webkitRequestFullscreen();
          }
        } catch (error) {
          console.warn(
            "Fullscreen unavailable:",
            error
          );
        }

        tryLandscape();

        if (
          fullscreenRequest &&
          typeof fullscreenRequest.then === "function"
        ) {
          fullscreenRequest.then(
            () => {
              tryLandscape();
            },
            (error) => {
              console.info(
                "Fullscreen unavailable. Continuing in browser.",
                error
              );
            }
          );
        }

        startGame();
      });
    }());
  </script>
</body>
</html>
